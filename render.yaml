# Render blueprint: deploys the prototype as a free Node web service.
# Set DATABASE_URL (a Postgres connection string, e.g. from a free Neon database) so flags survive restarts.
services:
  - type: web
    name: oioioi
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/hazards
    envVars:
      - key: DATABASE_URL
        sync: false
